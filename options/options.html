<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>SeriesSync — Réglages</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options">
      <h1>SeriesSync</h1>

      <section class="section">
        <h2>BetaSeries</h2>
        <p>Statut : <span id="auth-status">…</span></p>
        <button id="connect-btn" class="btn btn--primary">Connecter BetaSeries</button>
        <button id="disconnect-btn" class="btn btn--ghost" hidden>Déconnecter</button>
      </section>

      <section class="section">
        <h2>Seuil de visionnage</h2>
        <p>Un épisode est considéré comme vu lorsque ce pourcentage est atteint (ou à la fin de la vidéo).</p>
        <select id="threshold-select">
          <option value="70">70%</option>
          <option value="80">80%</option>
          <option value="90">90%</option>
          <option value="100">100%</option>
        </select>
      </section>

      <section class="section">
        <h2>Mode simulation</h2>
        <p>Détecte et recherche les épisodes sur BetaSeries sans jamais les marquer comme vus.</p>
        <label class="checkbox"><input type="checkbox" id="simulation-toggle" /> Activer le mode simulation</label>
      </section>

      <section class="section">
        <h2>Journal de diagnostic</h2>
        <label class="checkbox"><input type="checkbox" id="debug-toggle" /> Activer les logs de debug (console)</label>
        <div id="log-list" class="log-list"></div>
        <button id="clear-logs-btn" class="btn btn--ghost">Vider le journal</button>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
